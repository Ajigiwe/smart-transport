name: smarttransport_gh
description: SmartTransport GH - Public Transport Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.0
  
  # HTTP Client
  dio: ^5.4.0
  
  # Secure Storage
  flutter_secure_storage: ^9.0.0
  
  # Maps
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  
  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  gap: ^3.0.1
  cupertino_icons: ^1.0.8
  
  # Utilities
  intl: ^0.19.0
  json_annotation: ^4.8.1
  
  # Splash Screen
  flutter_native_splash: ^2.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/logo.png
    - assets/images/
    - assets/icons/
